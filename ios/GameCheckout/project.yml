name: GameCheckout
options:
  bundleIdPrefix: ws.chill.gamecheckout
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  AEPCore:
    url: https://github.com/adobe/aepsdk-core-ios.git
    from: 5.0.0
  AEPEdge:
    url: https://github.com/adobe/aepsdk-edge-ios.git
    from: 5.0.0
  AEPEdgeIdentity:
    url: https://github.com/adobe/aepsdk-edgeidentity-ios.git
    from: 5.0.0
  AEPRulesEngine:
    url: https://github.com/adobe/aepsdk-rulesengine-ios.git
    from: 5.0.0
targets:
  GameCheckout:
    type: application
    platform: iOS
    sources:
      - path: GameCheckout
    dependencies:
      - package: AEPCore
        product: AEPCore
      - package: AEPEdge
        product: AEPEdge
      - package: AEPEdgeIdentity
        product: AEPEdgeIdentity
      - package: AEPRulesEngine
        product: AEPRulesEngine
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Game Checkout
        UILaunchScreen: {}
        API_BASE_URL: $(API_BASE_URL)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ws.chill.gamecheckout
        PRODUCT_NAME: GameCheckout
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
schemes:
  GameCheckout:
    build:
      targets:
        GameCheckout: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
