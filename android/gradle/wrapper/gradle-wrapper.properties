# NOTE: this project does not ship gradle-wrapper.jar. ./gradlew is a small
# launcher that locates Gradle 8.13+ itself; see the "About gradlew" section of
# README.md. This file is kept so that dropping in a standard wrapper.jar later
# works without further changes.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
